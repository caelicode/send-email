name: Test Email

on:
  workflow_dispatch:
    inputs:
      to:
        description: 'Recipient email address for test'
        required: true
        type: string

permissions:
  contents: read

jobs:
  send-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Send test email
        uses: ./
        with:
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          to: ${{ inputs.to }}
          subject: '[Test] send-email action — ${{ github.run_id }}'
          body: |
            This is an automated test from caelicode/send-email.

            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          html: |
            <p>This is an automated test from <strong>caelicode/send-email</strong>.</p>
            <p><a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">
              View workflow run
            </a></p>
          from: noreply@caelicode.com
          server_address: smtp.resend.com
          server_port: '465'
          secure: 'true'
